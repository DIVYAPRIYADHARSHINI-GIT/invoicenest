<!doctype html>
<html lang="en-IN" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="InvoiceNest - Bill right. Get paid. Free GST invoice and quotation generator for Indian freelancers and small businesses. Your data stays in your browser." />
		<meta name="theme-color" content="#1B2440" />
		<script>
			// Apply the saved theme before first paint so there is no flash.
			try {
				const raw = localStorage.getItem('invoicenest.v1');
				const pref = raw ? JSON.parse(raw)?.settings?.theme : 'system';
				const dark = pref === 'dark' || ((!pref || pref === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			} catch (e) {
				/* storage blocked - keep the light default */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
